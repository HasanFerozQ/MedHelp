<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USMLE Mock Exam Lobby | MediHelp</title>
  <link rel="icon" href="icons/favicon.ico?v=1.1" type="image/x-icon">
  <link rel="shortcut icon" href="icons/favicon.ico?v=1.1" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="core.js"></script>
  <script src="mock-exam-config.js"></script>
  <style>
    .mock-lobby { padding: 40px 0 80px; }
    .mock-step-nav {
      display: flex;
      gap: 10px;
      margin: 32px 0 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      flex-wrap: wrap;
    }
    .mock-step-tab {
      padding: 12px 28px;
      color: var(--text-muted);
      font-weight: 800;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.3s ease;
      border: none;
      background: transparent;
      font-size: 14px;
    }
    .mock-step-tab:hover { color: var(--text-h); background: var(--bg-card); }
    .mock-step-tab.active {
      color: white;
      background: #a855f7;
      box-shadow: 0 4px 15px rgba(168,85,247,0.3);
    }
    .mock-panel { display: none; }
    .mock-panel.active { display: block; }
    .mock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-top: 28px;
      align-items: stretch;
    }
    .mock-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 420px;
    }
    .mock-card:hover { border-color: #a855f7; transform: translateY(-4px); }
    .mock-card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .mock-card h3 { font-size: 20px; font-weight: 900; margin-bottom: 10px; color: var(--text-h); }
    .mock-card-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.55;
      margin: 0 0 16px;
      min-height: 4.65em;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .mock-card-books {
      flex: 1;
      min-height: 5.5em;
      max-height: 5.5em;
      overflow-y: auto;
      margin-bottom: 16px;
      padding: 10px 12px;
      background: rgba(168, 85, 247, 0.06);
      border: 1px solid rgba(168, 85, 247, 0.15);
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.45;
      color: var(--text-muted);
    }
    .mock-card-books strong {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a855f7;
      margin-bottom: 6px;
      font-weight: 800;
    }
    .mock-card-stats {
      margin-top: auto;
    }
    .mock-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(168,85,247,0.1);
      color: #a855f7;
      margin-bottom: 8px;
    }
    .mock-badge-free {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 800;
      background: var(--accent);
      color: #000;
      margin-left: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .mock-badge-premium {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 800;
      background: rgba(168,85,247,0.2);
      color: #c084fc;
      margin-left: 8px;
      text-transform: uppercase;
    }
    .mock-stat {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 8px;
    }
    .btn-start-mock {
      width: 100%;
      margin-top: 24px;
      background: #a855f7;
      color: white;
      font-weight: 800;
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-start-mock:hover:not(:disabled) { background: #7e22ce; }
    .btn-start-mock:disabled,
    .btn-start-mock.coming-soon {
      background: var(--border);
      cursor: not-allowed;
      color: var(--text-muted);
    }
    .mock-tab-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
      font-weight: 600;
    }
    @media (max-width: 768px) {
      .mock-step-nav { gap: 6px; }
      .mock-step-tab { padding: 10px 16px; font-size: 13px; flex: 1; text-align: center; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-content">
      <a href="/" class="nav-brand">
        <img src="icons/logo.png?v=1.1" alt="MediHelp — Medical Bill Audit">
        MediHelp
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/medical-exam-preparation" class="active">Medical Exams</a>
        <a href="/medical-bill-audit">Medical Bill Audit</a>
        <div class="nav-dropdown">
          <div class="nav-dropdown-btn">Codes ▼</div>
          <div class="nav-dropdown-menu">
            <a href="/cpt-code-search">CPT Codes</a>
            <a href="/claim-denial-codes">Denial Codes</a>
          </div>
        </div>
        <div class="nav-dropdown">
          <div class="nav-dropdown-btn">More ▼</div>
          <div class="nav-dropdown-menu">
            <a href="/rx-savings">Rx Savings</a>
            <a href="/providers">Provider Search</a>
            <a href="/blog">Blog</a>
          </div>
        </div>
      </div>
      <div class="nav-actions">
        <a href="/pricing" class="btn btn-ghost" style="padding:8px 18px; font-size:14px; border-radius:10px;">Expert Help</a>
        <button id="theme-toggle" title="Toggle Dark/Light Mode" class="theme-btn">🌙</button>
        <div class="nav-toggle" onclick="MediHelp.toggleMobileMenu()">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </nav>

  <main class="container mock-lobby">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 40px;">
      <a href="medical-exam-usmle.html" style="color: var(--text-muted); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="transform: rotate(180deg);"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg> Back to Dash</a>
    </div>

    <h1 class="hero-h1" style="text-align: left;">Full-Length <span style="color: #a855f7;">Mock Exams</span></h1>
    <p class="hero-sub" style="margin: 0; text-align: left;">Standardized simulations replicating the real board exam environment.</p>

    <div class="mock-step-nav" id="mock-step-nav" role="tablist">
      <button type="button" class="mock-step-tab active" data-tab="step1" role="tab" aria-selected="true">USMLE Step 1</button>
      <button type="button" class="mock-step-tab" data-tab="step2" role="tab" aria-selected="false">USMLE Step 2 CK</button>
      <button type="button" class="mock-step-tab" data-tab="step3" role="tab" aria-selected="false">USMLE Step 3</button>
    </div>

    <div id="panel-step1" class="mock-panel active" role="tabpanel"></div>
    <div id="panel-step2" class="mock-panel" role="tabpanel"></div>
    <div id="panel-step3" class="mock-panel" role="tabpanel"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="text-align: center;">
        <span>© 2026 MediHelp. Board Prep Excellence.</span>
      </div>
    </div>
  </footer>

  <script>
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderExamCard(exam) {
      const freeBadge = exam.freeDemo ? '<span class="mock-badge-free">Free Demo</span>' : '';
      const premiumBadge = exam.premiumOnly ? '<span class="mock-badge-premium">Premium</span>' : '';
      const summary = exam.summary || exam.description || '';

      const btnHtml = exam.comingSoon
        ? '<button class="btn-start-mock coming-soon" disabled>Coming Soon</button>'
        : `<button class="btn-start-mock" onclick="startExam('${exam.id}')">Start Exam</button>`;

      const booksHtml = exam.showTextbooks && MockExamConfig.step1TextbookSources
        ? `<div class="mock-card-books" title="Step 1 textbook sources"><strong>Sources</strong>${MockExamConfig.step1TextbookSources.map((b) => escapeHtml(b)).join(' · ')}</div>`
        : '<div class="mock-card-books" style="visibility:hidden; border-color:transparent; background:transparent;" aria-hidden="true">&nbsp;</div>';

      const qLine = exam.questions
        ? `<div class="mock-stat"><span>Questions</span><span style="color: var(--text-h); font-weight: 700;">${exam.questions} MCQs</span></div>`
        : '';
      const timeLine = exam.totalHours
        ? `<div class="mock-stat"><span>Total Time</span><span style="color: var(--text-h); font-weight: 700;">${exam.totalHours} Hours</span></div>`
        : '';
      const formatLine = exam.format
        ? `<div class="mock-stat"><span>Format</span><span style="color: var(--text-h); font-weight: 700;">${exam.format}</span></div>`
        : '';

      return `
        <div class="mock-card">
          <div class="mock-card-body">
            <div>
              <span class="mock-badge">${exam.badge}</span>${freeBadge}${premiumBadge}
              <h3>${exam.title}</h3>
              <p class="mock-card-desc">${escapeHtml(summary)}</p>
            </div>
            ${booksHtml}
            <div class="mock-card-stats">
              ${qLine}
              ${timeLine}
              ${formatLine}
            </div>
          </div>
          ${btnHtml}
        </div>
      `;
    }

    function renderPanels() {
      ['step1', 'step2', 'step3'].forEach((tab) => {
        const panel = document.getElementById(`panel-${tab}`);
        const exams = MockExamConfig.getExamsForTab(tab);
        if (!exams.length) {
          panel.innerHTML = '<p class="mock-tab-empty">Full-length mocks for this step are coming soon.</p>';
          return;
        }
        panel.innerHTML = `<div class="mock-grid">${exams.map((e) => renderExamCard(e)).join('')}</div>`;
      });
    }

    document.querySelectorAll('.mock-step-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mock-step-tab').forEach((t) => {
          t.classList.remove('active');
          t.setAttribute('aria-selected', 'false');
        });
        document.querySelectorAll('.mock-panel').forEach((p) => p.classList.remove('active'));
        tab.classList.add('active');
        tab.setAttribute('aria-selected', 'true');
        document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
      });
    });

    function startExam(id) {
      const exam = MockExamConfig.getExam(id);
      if (exam.comingSoon) return;
      const msg = exam.confirmMessage || 'Ready to start this mock exam? The clock runs in real time once you begin.';
      if (confirm(msg)) {
        window.location.href = `medical-exam-simulator.html?exam_id=${encodeURIComponent(id)}`;
      }
    }

    renderPanels();
    if (window.MediHelp) MediHelp.initTheme();

    const hashTab = new URLSearchParams(window.location.search).get('tab');
    if (hashTab && ['step1', 'step2', 'step3'].includes(hashTab)) {
      document.querySelector(`.mock-step-tab[data-tab="${hashTab}"]`)?.click();
    }
  </script>
</body>
</html>
