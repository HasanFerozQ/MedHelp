    <h1>BSA Calculator — Mosteller Formula</h1>
    <p class="lede">Mosteller BSA = sqrt((height(cm) × weight(kg))/3600)</p>
    <h2>Clinical use</h2>
    <p>Used for chemotherapy dosing, cardiac index normalization, and physiological scaling.</p>
    <h2>Example</h2>
    <p>Height 170 cm, weight 70 kg → BSA = sqrt((170×70)/3600) ≈ 1.84 m²</p>
