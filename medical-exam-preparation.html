<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Exam Preparation | MediHelp</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="core.js"></script>
  <style>
    .prep-hero { padding: 40px 0; border-bottom: 1px solid var(--border); background: var(--bg-elevated); margin-bottom: 40px; }
    .semester-nav { display: flex; gap: 4px; overflow-x: auto; padding: 10px 0; margin-bottom: 30px; scrollbar-width: none; border-bottom: 1px solid var(--border); }
    .semester-tab { 
      padding: 12px 24px; color: var(--text-muted); font-weight: 700; font-size: 14px; 
      cursor: pointer; border-radius: var(--radius-sm); white-space: nowrap; transition: var(--transition);
      border: 1px solid transparent;
    }
    .semester-tab:hover { color: var(--text-h); background: var(--bg-card); }
    .semester-tab.active { color: var(--accent); background: var(--accent-glow); border-color: var(--border-accent); }

    .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .topic-card { 
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; 
      cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
    }
    .topic-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: var(--shadow-accent); }
    .topic-card h3 { font-size: 18px; font-weight: 800; color: var(--text-h); line-height: 1.3; }
    .topic-progress { font-size: 12px; color: var(--text-muted); font-weight: 600; display: flex; flex-direction: column; gap: 8px; }
    .topic-stats-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .progress-bar-bg { height: 6px; background: var(--bg-elevated); border-radius: 3px; margin-top: 5px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s ease; }

    /* MCQ AREA */
    #mcq-container { display: none; }
    .quiz-header { 
      position: sticky; top: 124px; z-index: 100; background: var(--bg-glass); backdrop-filter: blur(20px); 
      padding: 16px 20px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 30px;
      display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow);
    }
    .mcq-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; margin-bottom: 24px; transition: var(--transition); }
    .mcq-image { width: 100%; max-height: 400px; object-fit: contain; border-radius: var(--radius-sm); margin-bottom: 24px; background: #000; border: 1px solid var(--border); }
    .mcq-question { font-size: 19px; font-weight: 700; color: var(--text-h); margin-bottom: 24px; line-height: 1.5; }
    .mcq-options { display: grid; gap: 12px; }
    .option-btn { 
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); 
      padding: 16px 20px; text-align: left; color: var(--text-body); font-size: 15px; font-weight: 600;
      cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 12px;
    }
    .option-btn:hover:not(.locked) { border-color: var(--accent); background: var(--bg-card-hover); }
    .option-btn.correct { background: rgba(34, 197, 94, 0.15) !important; border-color: var(--success) !important; color: var(--success); }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.15) !important; border-color: var(--danger) !important; color: var(--danger); }
    .option-btn.locked { cursor: default; }

    .explanation-box { 
      margin-top: 24px; padding: 20px; background: rgba(34, 197, 94, 0.05); border-left: 4px solid var(--accent); 
      border-radius: 4px; display: none; 
    }
    .explanation-box h4 { font-size: 14px; font-weight: 800; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; }
    .explanation-box p { font-size: 14px; color: var(--text-body); line-height: 1.6; }

    .score-badge { background: var(--bg-card); color: var(--text-h); padding: 8px 16px; border-radius: 12px; font-weight: 800; font-size: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; }
    .score-badge.mcq { border-left: 4px solid var(--success); }
    .score-badge.case { border-left: 4px solid #a855f7; }
    
    .hidden { display: none; }

    /* SEARCH BAR STYLES - UI FIX */
    .search-container { position: relative; max-width: 600px; margin-top: 24px; }
    .search-input-wrapper { 
      display: flex; align-items: center; background: var(--bg-card); 
      border: 1px solid var(--border); border-radius: 100px; padding: 2px 20px; 
      transition: var(--transition); box-shadow: var(--shadow);
    }
    .search-input-wrapper:focus-within { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 4px var(--accent-glow);
      background: var(--bg-elevated);
    }
    .search-input { 
      background: transparent !important; border: none !important; 
      color: var(--text-h); padding: 12px 10px; width: 100%; 
      font-size: 16px; font-weight: 600; outline: none !important; 
      box-shadow: none !important;
    }
    .search-input::placeholder { color: var(--text-muted); opacity: 0.7; }
    
    .search-results { 
      position: absolute; top: calc(100% + 10px); left: 0; right: 0; background: var(--bg-glass); 
      backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius); 
      box-shadow: 0 10px 40px rgba(0,0,0,0.4); max-height: 400px; overflow-y: auto; z-index: 2000;
      visibility: hidden; opacity: 0; transform: translateY(10px); transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .search-results.visible { visibility: visible; opacity: 1; transform: translateY(0); }
    .search-item { padding: 14px 20px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: rgba(255,255,255,0.05); }
    .search-item-title { font-weight: 700; color: var(--text-h); font-size: 14px; }
    .search-item-sem { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; background: var(--accent-glow); color: var(--accent); white-space: nowrap; }

    /* Custom Confirmation Modal */
    #confirm-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      z-index: 10000; display: flex; align-items: center; justify-content: center;
      visibility: hidden; opacity: 0; transition: var(--transition);
    }
    #confirm-modal.visible { visibility: visible; opacity: 1; }
    .confirm-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px; max-width: 400px; width: 90%; text-align: center; box-shadow: var(--shadow);
      transform: scale(0.9); transition: var(--transition);
    }
    #confirm-modal.visible .confirm-card { transform: scale(1); }
    .confirm-title { font-size: 18px; font-weight: 800; color: var(--text-h); margin-bottom: 12px; }
    .confirm-text { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .confirm-btns { display: flex; gap: 12px; justify-content: center; }
    
    /* CASE STUDY STYLES */
    .case-box { 
      background: var(--bg-card); border: 2px solid var(--accent); border-radius: var(--radius); 
      padding: 32px; margin-bottom: 32px; position: relative; overflow: hidden;
    }
    .case-box::before {
      content: 'CLINICAL CASE SCENARIO'; position: absolute; top: 0; left: 0; 
      background: var(--accent); color: #000; font-size: 10px; font-weight: 900; 
      padding: 4px 12px; border-bottom-right-radius: 8px; letter-spacing: 1px;
    }
    .case-title { font-size: 20px; font-weight: 900; color: var(--accent); margin-bottom: 16px; margin-top: 10px; }
    .case-scenario { font-size: 16px; line-height: 1.7; color: var(--text-h); font-style: italic; border-left: 3px solid var(--accent-glow); padding-left: 20px; }
    
    .section-divider { 
      display: flex; align-items: center; gap: 20px; margin: 60px 0 30px; 
      color: var(--text-muted); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
    }
    .section-divider::before, .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    
    /* MOBILE RESPONSIVENESS */
    @media (max-width: 768px) {
      .prep-hero { padding: 30px 0; margin-bottom: 20px; }
      .prep-hero h1 { font-size: 28px !important; }
      .prep-hero p { font-size: 15px !important; }
      
      .semester-nav { padding: 5px 0; margin-bottom: 20px; }
      .semester-tab { padding: 10px 18px; font-size: 13px; }
      
      .topic-grid { grid-template-columns: 1fr; gap: 16px; }
      .topic-card { padding: 20px; }
      
      .quiz-header { 
        position: fixed; top: 60px; left: 0; right: 0; 
        border-radius: 0; border-left: none; border-right: none; margin-bottom: 0;
        padding: 12px 16px;
      }
      #mcq-list { margin-top: 100px; }
      
      .mcq-card { padding: 20px; border-radius: var(--radius-sm); }
      .mcq-question { font-size: 17px; }
      .option-btn { padding: 14px 16px; font-size: 14px; }
      
      .case-box { padding: 20px; }
      .case-title { font-size: 18px; }
      .case-scenario { font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- Custom Confirm Modal -->
  <div id="confirm-modal">
    <div class="confirm-card">
      <div class="confirm-title">Are you sure?</div>
      <div class="confirm-text" id="confirm-msg">This action cannot be undone.</div>
      <div class="confirm-btns">
        <button id="confirm-cancel" class="btn btn-ghost">Cancel</button>
        <button id="confirm-yes" class="btn btn-primary" style="background: var(--danger); box-shadow: 0 4px 20px rgba(239, 68, 68, 0.2);">Yes, Reset</button>
      </div>
    </div>
  </div>

  <!-- ── NAV ── -->
  <nav class="navbar">
    <div class="container nav-content">
      <a href="/" class="nav-brand">
        <img src="icons/logo.png?v=1.1" alt="MediHelp">
        MediHelp
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/medical-exam-preparation" class="active">Exam Prep</a>
      </div>
      <div class="nav-actions">
        <button id="theme-toggle" title="Toggle Dark/Light Mode" style="margin-right: 20px;">🌙</button>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <header class="prep-hero">
    <div class="container">
      <div class="hero-eyebrow">Interactive Learning</div>
      <h1 style="font-size: 40px; font-weight: 900; color: var(--text-h); letter-spacing: -1.5px; margin-bottom: 12px;">Medical Exam Preparation</h1>
      <p style="color: var(--text-muted); font-size: 18px; max-width: 800px;">Master 8 semesters of MBBS & US-Standard syllabus with 100 high-yield MCQs per topic.</p>
      
      <!-- Smart Search -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="topic-search" class="search-input" placeholder="Search topics across all semesters..." autocomplete="off">
        </div>
        <div id="search-results" class="search-results">
          <!-- Results injected here -->
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-bottom: 100px;">
    
    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view">
      <div class="semester-nav" id="semester-bar">
        <!-- Injected Semesters -->
      </div>

      <div id="topic-loading" style="text-align:center; padding: 40px; color: var(--text-muted);">Loading topics...</div>
      <div class="topic-grid" id="topic-grid">
        <!-- Injected Topics -->
      </div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="mcq-view" class="hidden">
      <!-- Sticky Header -->
      <div class="quiz-header">
        <div style="display:flex; align-items:center; gap:16px;">
          <button class="btn btn-ghost" onclick="showDashboard()" style="padding: 8px 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            Back
          </button>
          <div>
            <h2 id="current-topic-title" style="font-size: 16px; font-weight: 800; color: var(--text-h);">Topic Name</h2>
            <p id="topic-stats" style="font-size: 12px; color: var(--text-muted); font-weight: 600;">0 / 100 Completed</p>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="score-badge" id="mcq-live-score" style="background: var(--accent-glow); border-color: var(--border-accent); color: var(--accent-light);">MCQ: 0/0</div>
          <div class="score-badge" id="case-live-score" style="background: rgba(168, 85, 247, 0.15); border-color: rgba(168, 85, 247, 0.3); color: #c084fc;">Case: 0/0</div>
          <button class="btn btn-ghost" onclick="resetTopic()" style="padding: 8px 12px; color: var(--danger);">Reset Progress</button>
        </div>
      </div>

      <div id="mcq-list" style="max-width: 800px; margin: 0 auto;">
        <!-- Injected Question Cards -->
      </div>

      <div id="quiz-loading" style="text-align:center; padding: 40px; color: var(--text-muted);">Loading MCQs...</div>
    </div>

  </main>

  <script>
    // --- STATE MANAGEMENT ---
    let currentSemester = 1;
    let currentTopicId = null;
    let userProgress = JSON.parse(localStorage.getItem('mh_prep_progress') || '{}');
    let allTopicsIndex = [];

    // Separate scoring maps
    let currentStandaloneIds = [];
    let currentCaseQuestionIds = [];
    let currentLoadedCases = [];

    function saveProgress() {
      localStorage.setItem('mh_prep_progress', JSON.stringify(userProgress));
    }

    // --- SEARCH LOGIC ---
    async function initSearch() {
      const { data, error } = await window.dbClient
        .from('topics')
        .select('id, title, semester_id')
        .order('title', { ascending: true });

      if (data) allTopicsIndex = data;

      const input = document.getElementById('topic-search');
      const resultsContainer = document.getElementById('search-results');

      input.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (!query) {
          resultsContainer.classList.remove('visible');
          return;
        }

        const matches = allTopicsIndex.filter(t => t.title.toLowerCase().includes(query)).slice(0, 10);
        
        if (matches.length > 0) {
          resultsContainer.innerHTML = matches.map(t => `
            <div class="search-item" onclick="navigateToTopic('${t.id}', '${escapeJs(t.title)}', ${t.semester_id})">
              <span class="search-item-title">${escapeHtml(t.title)}</span>
              <span class="search-item-sem">Semester ${t.semester_id}</span>
            </div>
          `).join('');
          resultsContainer.classList.add('visible');
        } else {
          resultsContainer.innerHTML = '<div class="search-item"><span style="color:var(--text-muted)">No topics found</span></div>';
          resultsContainer.classList.add('visible');
        }
      });

      // Close results when clicking outside
      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !resultsContainer.contains(e.target)) {
          resultsContainer.classList.remove('visible');
        }
      });
    }

    function navigateToTopic(topicId, title, semId) {
      document.getElementById('topic-search').value = '';
      document.getElementById('search-results').classList.remove('visible');
      
      switchSemester(semId);
      startQuiz(topicId, title);
    }

    function escapeJs(str) {
      return str.replace(/'/g, "\\'");
    }

    // --- DASHBOARD LOGIC ---
    async function initSemesters() {
      const bar = document.getElementById('semester-bar');
      bar.innerHTML = '';
      
      for (let i = 1; i <= 8; i++) {
        const tab = document.createElement('div');
        tab.className = `semester-tab ${i === currentSemester ? 'active' : ''}`;
        tab.textContent = `Semester ${i}`;
        tab.onclick = () => switchSemester(i);
        bar.appendChild(tab);
      }
      loadTopics(currentSemester);
    }

    function switchSemester(id) {
      currentSemester = id;
      document.querySelectorAll('.semester-tab').forEach((t, i) => {
        t.classList.toggle('active', (i + 1) === id);
      });
      loadTopics(id);
    }

    async function loadTopics(semId) {
      const grid = document.getElementById('topic-grid');
      const loader = document.getElementById('topic-loading');
      
      grid.innerHTML = '';
      loader.classList.remove('hidden');

      const { data, error } = await window.dbClient
        .from('topics')
        .select('*, mcqs(id), case_studies(id, case_questions(id))')
        .eq('semester_id', semId)
        .order('order', { ascending: true });

      loader.classList.add('hidden');

      if (error || !data.length) {
        grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; padding: 40px; color: var(--text-muted);">No topics added for this semester yet.</p>';
        return;
      }

      data.forEach(topic => {
        const totalMcqs = topic.mcqs.length;
        const topicProg = userProgress[topic.id] || {};
        
        // MCQ Progress
        const mcqIds = topic.mcqs.map(m => m.id);
        const progressMcqs = mcqIds.filter(id => topicProg[id]).length;
        
        // Case Progress (Scenarios)
        const totalCases = topic.case_studies.length;
        let completedCases = 0;
        topic.case_studies.forEach(cs => {
          const qIds = cs.case_questions.map(q => q.id);
          const correct = qIds.filter(id => topicProg[id] && topicProg[id].correct).length;
          if (qIds.length > 0 && correct === qIds.length) completedCases++;
        });

        const totalQ = totalMcqs + topic.case_studies.flatMap(cs => cs.case_questions).length;
        const totalCorrect = Object.values(topicProg).filter(v => v.correct).length;
        const percent = totalQ > 0 ? Math.round((totalCorrect / totalQ) * 100) : 0;

        const card = document.createElement('div');
        card.className = 'topic-card';
        card.onclick = () => startQuiz(topic.id, topic.title);
        card.innerHTML = `
          <div>
            <h3>${escapeHtml(topic.title)}</h3>
          </div>
          <div class="topic-progress">
            <div class="topic-stats-row">
              <span style="color:var(--success)">• ${progressMcqs} / ${totalMcqs} MCQs</span>
              <span>${percent}%</span>
            </div>
            ${totalCases > 0 ? `
            <div class="topic-stats-row">
              <span style="color:#a855f7">• ${completedCases} / ${totalCases} Cases</span>
            </div>
            ` : ''}
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${percent}%;"></div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // --- QUIZ LOGIC ---
    async function startQuiz(topicId, title) {
      currentTopicId = topicId;
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('mcq-view').classList.remove('hidden');
      document.getElementById('current-topic-title').textContent = title;
      
      loadMcqs(topicId);
    }

    function showDashboard() {
      document.getElementById('mcq-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');
      loadTopics(currentSemester);
    }

    async function loadMcqs(topicId) {
      const list = document.getElementById('mcq-list');
      const loader = document.getElementById('quiz-loading');
      list.innerHTML = '';
      loader.classList.remove('hidden');

      // 1. Fetch High-Yield Standalone MCQs
      const { data: mcqs, error: mError } = await window.dbClient
        .from('mcqs')
        .select('*')
        .eq('topic_id', topicId)
        .order('created_at', { ascending: true });

      // 2. Fetch Clinical Case Studies
      const { data: cases, error: cError } = await window.dbClient
        .from('case_studies')
        .select('*, case_questions(*)')
        .eq('topic_id', topicId)
        .order('order', { ascending: true });

      loader.classList.add('hidden');

      // Reset ID tracking
      currentStandaloneIds = [];
      currentCaseQuestionIds = [];
      currentLoadedCases = [];

      if ((mError || !mcqs.length) && (cError || !cases.length)) {
        list.innerHTML = '<p style="text-align:center; padding: 40px;">No questions found for this topic.</p>';
        return;
      }

      // Render Standalone MCQs
      if (mcqs && mcqs.length > 0) {
        currentStandaloneIds = mcqs.map(m => m.id);
        const header = document.createElement('div');
        header.className = 'section-divider';
        header.textContent = 'High-Yield MCQs';
        list.appendChild(header);
        
        mcqs.forEach((mcq, idx) => {
          list.appendChild(renderMcqCard(mcq, idx, 'mcq'));
        });
      }

      // Render Clinical Cases
      if (cases && cases.length > 0) {
        const header = document.createElement('div');
        header.className = 'section-divider';
        header.textContent = 'Clinical Case Studies';
        list.appendChild(header);

        currentLoadedCases = cases;
        cases.forEach((cs, cIdx) => {
          currentCaseQuestionIds.push(...cs.case_questions.map(q => q.id));
          list.appendChild(renderCaseBlock(cs, cIdx));
        });
      }
      
      updateQuizHeader();
    }

    function renderCaseBlock(cs, index) {
      const container = document.createElement('div');
      container.style.marginBottom = '60px';

      const caseBox = document.createElement('div');
      caseBox.className = 'case-box';
      caseBox.innerHTML = `
        <div class="case-title">${escapeHtml(cs.title)}</div>
        <div class="case-scenario">${escapeHtml(cs.scenario).replace(/\n/g, '<br>')}</div>
      `;
      container.appendChild(caseBox);

      // Render sub-questions
      cs.case_questions.forEach((q, qIdx) => {
        container.appendChild(renderMcqCard(q, qIdx, 'case'));
      });

      return container;
    }

    function renderMcqCard(mcq, index, type) {
      const card = document.createElement('div');
      card.className = 'mcq-card';
      card.id = `mcq-${mcq.id}`;
      
      const answered = userProgress[currentTopicId] && userProgress[currentTopicId][mcq.id];
      const qPrefix = type === 'case' ? `Case Question ${index + 1}` : `Question ${index + 1}`;
      
      card.innerHTML = `
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:12px; font-weight:700;">${qPrefix}</div>
        ${mcq.image_url ? `<img src="${mcq.image_url}" class="mcq-image" loading="lazy">` : ''}
        <div class="mcq-question">${escapeHtml(mcq.question)}</div>
        <div class="mcq-options">
          ${mcq.options.map((opt, i) => `
            <button class="option-btn ${answered ? 'locked' : ''} ${answered && answered.choice === i ? (i === mcq.correct_index ? 'correct' : 'incorrect') : ''} ${answered && i === mcq.correct_index ? 'correct' : ''}" 
                    onclick="handleAnswer('${mcq.id}', ${i}, ${mcq.correct_index})">
              <span style="opacity:0.6; width:20px; font-weight:800;">${String.fromCharCode(65 + i)}</span>
              ${escapeHtml(opt)}
            </button>
          `).join('')}
        </div>
        <div class="explanation-box" id="explanation-${mcq.id}" style="${answered ? 'display:block;' : ''}">
          <h4>Learning Note</h4>
          <p id="correct-answer-text-${mcq.id}" style="margin-bottom:8px; display: ${answered ? 'block' : 'none'};">
            <strong>Correct Answer:</strong> <span class="answer-label" style="color:var(--success); font-weight:800;"></span>
          </p>
          <p class="explanation-text">${escapeHtml(mcq.explanation || 'No explanation provided.')}</p>
        </div>
      `;
      
      // If already answered, set the label text
      if (answered) {
        setTimeout(() => {
          const label = card.querySelector(`#correct-answer-text-${mcq.id} .answer-label`);
          if (label) label.textContent = mcq.options[mcq.correct_index];
        }, 0);
      }

      return card;
    }

    function handleAnswer(mcqId, choice, correctIndex) {
      if (userProgress[currentTopicId] && userProgress[currentTopicId][mcqId]) return;

      if (!userProgress[currentTopicId]) userProgress[currentTopicId] = {};
      userProgress[currentTopicId][mcqId] = {
        choice: choice,
        correct: choice === correctIndex
      };
      
      saveProgress();

      // Update UI
      const card = document.getElementById(`mcq-${mcqId}`);
      const btns = card.querySelectorAll('.option-btn');
      
      btns.forEach((btn, i) => {
        btn.classList.add('locked');
        if (i === correctIndex) btn.classList.add('correct');
        if (i === choice && i !== correctIndex) btn.classList.add('incorrect');
      });

      // Show correct answer text and explanation
      const expBox = document.getElementById(`explanation-${mcqId}`);
      const correctText = document.getElementById(`correct-answer-text-${mcqId}`);
      const label = correctText.querySelector('.answer-label');
      
      // Get the correct option text from the button
      label.textContent = btns[correctIndex].textContent.trim().substring(2); // Remove the 'A ', 'B ' prefix
      
      correctText.style.display = 'block';
      expBox.style.display = 'block';
      
      updateQuizHeader();
    }

    function updateQuizHeader() {
      const topicProgress = userProgress[currentTopicId] || {};
      
      const mcqAnswered = currentStandaloneIds.filter(id => topicProgress[id]);
      const mcqCorrect = mcqAnswered.filter(id => topicProgress[id].correct).length;
      
      const caseAnswered = currentCaseQuestionIds.filter(id => topicProgress[id]);
      
      // Calculate completed scenarios (where all questions for that scenario are correct)
      let casesCompletedCount = 0;
      currentLoadedCases.forEach(cs => {
        const scenarioQuestions = cs.case_questions.map(q => q.id);
        const correctInScenario = scenarioQuestions.filter(id => topicProgress[id] && topicProgress[id].correct).length;
        if (scenarioQuestions.length > 0 && correctInScenario === scenarioQuestions.length) {
          casesCompletedCount++;
        }
      });
      
      const totalAnswered = mcqAnswered.length + caseAnswered.length;
      const totalPossible = currentStandaloneIds.length + currentCaseQuestionIds.length;

      document.getElementById('topic-stats').textContent = `${totalAnswered} / ${totalPossible} Questions Completed`;
      
      document.getElementById('mcq-live-score').textContent = `MCQ: ${mcqCorrect} / ${currentStandaloneIds.length}`;
      document.getElementById('case-live-score').textContent = `Case: ${casesCompletedCount} / ${currentLoadedCases.length}`;
      
      // Hide case score if no cases exist
      document.getElementById('case-live-score').style.display = currentCaseQuestionIds.length ? 'block' : 'none';
    }

    function resetTopic() {
      showConfirm('Are you sure you want to reset all progress for this topic?', () => {
        delete userProgress[currentTopicId];
        saveProgress();
        loadMcqs(currentTopicId);
      });
    }

    // --- CUSTOM CONFIRM LOGIC ---
    let confirmCallback = null;
    function showConfirm(msg, callback) {
      document.getElementById('confirm-msg').textContent = msg;
      confirmCallback = callback;
      document.getElementById('confirm-modal').classList.add('visible');
    }

    document.getElementById('confirm-cancel').addEventListener('click', () => {
      document.getElementById('confirm-modal').classList.remove('visible');
    });

    document.getElementById('confirm-yes').addEventListener('click', () => {
      if (confirmCallback) confirmCallback();
      document.getElementById('confirm-modal').classList.remove('visible');
    });

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      initSemesters();
      initSearch();
    });
  </script>
</body>
</html>
