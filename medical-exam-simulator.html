<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USMLE Step 1 Simulator | MediHelp</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="core.js"></script>
  <style>
    body { background: #0a0f18; }
    .sim-header {
      background: #111827;
      border-bottom: 2px solid #374151;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .timer-pill {
      background: #000;
      border: 1px solid #4b5563;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
      color: #10b981;
    }
    .timer-pill.warning { color: #f59e0b; border-color: #f59e0b; }
    .timer-pill.danger { color: #ef4444; border-color: #ef4444; }

    .block-status {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .block-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #374151;
    }
    .block-dot.active { background: #a855f7; box-shadow: 0 0 10px #a855f7; }
    .block-dot.done { background: #10b981; }

    .sim-main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    .question-nav {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin-bottom: 30px;
    }
    .q-btn {
      aspect-ratio: 1;
      border: 1px solid #374151;
      background: #1f2937;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
    }
    .q-btn.current { border-color: #a855f7; color: white; background: rgba(168,85,247,0.1); }
    .q-btn.answered { background: #10b981; color: #0a0f18; border-color: #10b981; }
    .q-btn.marked { border-color: #f59e0b; color: #f59e0b; position: relative; }
    .q-btn.marked::after { content: '★'; position: absolute; top: -5px; right: -5px; font-size: 8px; }

    .mcq-area {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 40px;
      min-height: 400px;
      position: relative;
    }
    
    .option-row {
      display: flex;
      gap: 16px;
      padding: 16px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .option-row:hover { background: #374151; }
    .option-row.selected { border-color: #a855f7; background: rgba(168,85,247,0.1); }
    .opt-letter { font-weight: 900; color: #a855f7; }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111827;
      border-top: 1px solid #374151;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .report-view {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }
    .report-card {
      background: #111827;
      border: 1px solid #374151;
      padding: 40px;
      border-radius: 20px;
      max-width: 600px;
      margin: 20px auto;
    }
  </style>
</head>
<body>

  <!-- SIMULATOR UI -->
  <div id="sim-ui">
    <header class="sim-header">
      <div class="block-status" id="block-dots">
        <!-- 7 dots -->
      </div>
      <div style="text-align: center;">
        <div style="font-size: 10px; color: #9ca3af; font-weight: 800; text-transform: uppercase;">Time Remaining (Current Block)</div>
        <div class="timer-pill" id="block-timer">60:00</div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 10px; color: #9ca3af; font-weight: 800; text-transform: uppercase;">Total Exam Clock</div>
        <div class="timer-pill" id="global-timer" style="color: #60a5fa;">08:00:00</div>
      </div>
    </header>

    <main class="sim-main">
      <div class="question-nav" id="q-nav">
        <!-- 40 buttons -->
      </div>

      <div class="mcq-area" id="mcq-area">
        <div id="loading-msg">Initializing Board Simulation...</div>
        <div id="mcq-content" class="hidden">
           <div id="q-text" class="mcq-question">Loading question...</div>
           <div id="options-list" class="mcq-options" style="margin-top: 24px;"></div>
        </div>
      </div>
    </main>

    <footer class="bottom-bar">
      <div>
        <button class="btn btn-ghost" id="mark-btn" onclick="toggleMark()">★ Mark for Review</button>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-secondary" onclick="prevQ()">Previous</button>
        <button class="btn btn-primary" onclick="nextQ()" id="next-btn">Next Question</button>
      </div>
      <div>
        <button class="btn btn-danger" id="end-block-btn" onclick="submitBlock()" style="background: #dc2626;">End Block</button>
        <button class="btn btn-secondary hidden" id="exit-review-btn" onclick="exitSimulator()">Exit Review</button>
      </div>
    </footer>
  </div>

  <!-- BREAK VIEW -->
  <div id="break-ui" class="hidden" style="text-align: center; padding: 100px 20px;">
    <h1 style="font-size: 48px; color: #a855f7; margin-bottom: 24px;">Optional Break</h1>
    <p style="color: var(--text-muted); font-size: 18px; margin-bottom: 40px;">Block submitted successfully. Your total exam clock is still running.</p>
    <div class="timer-pill" id="global-timer-break" style="display:inline-block; font-size: 48px; padding: 20px 40px;">00:00:00</div>
    <div style="margin-top: 60px;">
      <button class="btn btn-primary" onclick="startNextBlock()" style="padding: 20px 40px; font-size: 20px;">Resume Exam: Start Next Block →</button>
    </div>
  </div>

  <!-- REPORT VIEW -->
  <div id="report-ui" class="report-view">
    <h1 style="font-size: 48px; color: #10b981;">Exam Complete</h1>
    <div class="report-card">
      <div id="report-stats">
        <!-- Stats injected here -->
      </div>
      <button class="btn btn-primary" onclick="exitSimulator()" style="margin-top: 40px; width: 100%; height: auto; padding: 16px;">Return to Dashboard</button>
    </div>
  </div>

  <script>
    // --- ENGINE STATE ---
    const TOTAL_BLOCKS = 7;
    const Q_PER_BLOCK = 40;
    const TOTAL_TIME = 8 * 60 * 60 * 1000; // 8 hours in ms
    const BLOCK_TIME = 60 * 60 * 1000; // 60 mins in ms
    
    let state = {
      examStartedAt: null,
      currentBlock: 0,
      currentQ: 0,
      questions: [], // [[{block1_q1}, ...], [{block2_q1}, ...]]
      answers: {}, // { globalIdx: index }
      marked: new Set(),
      blockStartTimes: {},
      isBreak: false,
      isReview: false
    };

    // --- DATA FETCHING ---
    async function initSimulator() {
      const loader = document.getElementById('loading-msg');
      loader.textContent = "Loading 280 board-style questions...";

      try {
        // 1. Fetch all Step 1 MCQs
        const { data, error } = await window.dbClient
          .from('mcqs')
          .select('*, topics!inner(*)')
          .eq('topics.usmle_step', 1);

        if (error || !data || data.length < 280) {
          throw new Error("Could not load full question pool. Ensure migration is complete.");
        }

        // 2. Shuffle everything
        const shuffled = shuffleArray(data);

        // 3. Partition into blocks
        state.questions = [];
        for (let i = 0; i < TOTAL_BLOCKS; i++) {
          state.questions.push(shuffled.slice(i * Q_PER_BLOCK, (i + 1) * Q_PER_BLOCK));
        }

        state.examStartedAt = Date.now();
        state.blockStartTimes[0] = Date.now();
        
        saveState();
        initUI();
      } catch (err) {
        console.error(err);
        loader.innerHTML = `<div style="color:#ef4444; font-weight:700;">Error: ${err.message}</div>`;
      }
    }

    function shuffleArray(array) {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    }

    function loadState() {
      const saved = localStorage.getItem('mh_sim_state');
      if (saved) {
        const parsed = JSON.parse(saved);
        state = { ...parsed, marked: new Set(parsed.marked) };
        initUI();
      } else {
        initSimulator();
      }
    }

    function saveState() {
      const toSave = { ...state, marked: Array.from(state.marked) };
      localStorage.setItem('mh_sim_state', JSON.stringify(toSave));
    }

    // --- TIMERS ---
    function updateTimers() {
      if (!state.examStartedAt || state.isReview) return;
      
      const now = Date.now();
      
      // Global Timer
      const elapsedTotal = now - state.examStartedAt;
      const remainingTotal = Math.max(0, TOTAL_TIME - elapsedTotal);
      document.getElementById('global-timer').textContent = formatTimeLong(remainingTotal);
      if (document.getElementById('global-timer-break')) {
        document.getElementById('global-timer-break').textContent = formatTimeLong(remainingTotal);
      }

      if (remainingTotal <= 0) {
        finishExam();
        return;
      }

      // Block Timer (Only if not in break)
      if (!state.isBreak) {
        const blockStart = state.blockStartTimes[state.currentBlock] || state.examStartedAt; 
        const elapsedBlock = now - blockStart;
        const remainingBlock = Math.max(0, BLOCK_TIME - elapsedBlock);
        
        const timerEl = document.getElementById('block-timer');
        timerEl.textContent = formatTimeShort(remainingBlock);
        
        if (remainingBlock < 300000) timerEl.className = 'timer-pill danger';
        else if (remainingBlock < 600000) timerEl.className = 'timer-pill warning';
        else timerEl.className = 'timer-pill';

        if (remainingBlock <= 0) submitBlock(true);
      }
    }

    function formatTimeLong(ms) {
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const rs = s % 60;
      return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${rs.toString().padStart(2,'0')}`;
    }

    function formatTimeShort(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const rs = s % 60;
      return `${m.toString().padStart(2,'0')}:${rs.toString().padStart(2,'0')}`;
    }

    // --- UI RENDER ---
    function initUI() {
      if (!state.questions.length) return;

      // Sync visibility
      if (state.isReview) {
        // Handled by finishExam/enterReviewMode transition
        // But for direct reload:
        document.getElementById('sim-ui').classList.remove('hidden');
        document.getElementById('break-ui').classList.add('hidden');
        document.getElementById('report-ui').classList.remove('visible');
        document.getElementById('end-block-btn').classList.add('hidden');
        document.getElementById('exit-review-btn').classList.remove('hidden');
        document.getElementById('block-timer').textContent = "REVIEW";
        document.getElementById('global-timer').textContent = "COMPLETE";
      } else if (state.isBreak) {
        document.getElementById('sim-ui').classList.add('hidden');
        document.getElementById('break-ui').classList.remove('hidden');
        document.getElementById('report-ui').classList.remove('visible');
      } else {
        document.getElementById('sim-ui').classList.remove('hidden');
        document.getElementById('break-ui').classList.add('hidden');
        document.getElementById('report-ui').classList.remove('visible');
      }

      const dots = document.getElementById('block-dots');
      dots.innerHTML = '';
      for (let i = 0; i < TOTAL_BLOCKS; i++) {
        const dot = document.createElement('div');
        dot.className = `block-dot ${i === state.currentBlock ? 'active' : (i < state.currentBlock ? 'done' : '')}`;
        dots.appendChild(dot);
      }

      const qNav = document.getElementById('q-nav');
      qNav.innerHTML = '';
      for (let i = 0; i < Q_PER_BLOCK; i++) {
        const btn = document.createElement('div');
        const globalIdx = state.currentBlock * Q_PER_BLOCK + i;
        btn.className = `q-btn ${i === state.currentQ ? 'current' : ''}`;
        if (state.answers[globalIdx] !== undefined) btn.classList.add('answered');
        if (state.marked.has(globalIdx)) btn.classList.add('marked');
        btn.textContent = i + 1;
        btn.onclick = () => jumpToQ(i);
        qNav.appendChild(btn);
      }
      
      renderQuestion();
    }

    function renderQuestion() {
       const globalIdx = state.currentBlock * Q_PER_BLOCK + state.currentQ;
       const q = state.questions[state.currentBlock][state.currentQ];
       const qTextEl = document.getElementById('q-text');
       const optionsEl = document.getElementById('options-list');
       const mcqArea = document.getElementById('mcq-area');
       
       document.getElementById('loading-msg').classList.add('hidden');
       document.getElementById('mcq-content').classList.remove('hidden');

       // Header & Image
       const imgHtml = q.image_url ? `<img src="${q.image_url}" class="mcq-image" style="width:100%; max-height:300px; object-fit:contain; border-radius:8px; margin-bottom:20px; border:1px solid #374151;">` : '';
       
       qTextEl.innerHTML = `
         <div style="font-size:11px; color:#9ca3af; margin-bottom:10px; font-weight:800; text-transform:uppercase;">Block ${state.currentBlock + 1} | Question ${state.currentQ + 1} of ${Q_PER_BLOCK}</div>
         ${imgHtml}
         <div style="line-height:1.6; font-size:18px;">${escapeHtml(q.question)}</div>
       `;
       
       const options = Array.isArray(q.options) ? q.options : JSON.parse(q.options);
       optionsEl.innerHTML = options.map((opt, i) => {
          let className = `option-row ${state.answers[globalIdx] === i ? 'selected' : ''}`;
          if (state.isReview) {
            if (i === q.correct_index) className += ' correct-answer'; // CSS to be added or inline
            if (state.answers[globalIdx] === i && i !== q.correct_index) className += ' wrong-answer';
          }

          return `
            <div class="${className}" onclick="${state.isReview ? '' : `selectOption(${i})`}" style="${state.isReview && i === q.correct_index ? 'border-color:#10b981; background:rgba(16,185,129,0.1);' : ''} ${state.isReview && state.answers[globalIdx] === i && i !== q.correct_index ? 'border-color:#ef4444; background:rgba(239,68,68,0.1);' : ''}">
              <span class="opt-letter" style="${state.isReview && i === q.correct_index ? 'color:#10b981;' : ''} ${state.isReview && state.answers[globalIdx] === i && i !== q.correct_index ? 'color:#ef4444;' : ''}">${String.fromCharCode(65 + i)})</span>
              <span>${escapeHtml(opt)}</span>
            </div>
          `;
       }).join('');

       // Explanation (Only in Review)
       const existingExp = document.getElementById('review-explanation');
       if (existingExp) existingExp.remove();
       
       if (state.isReview) {
         const expDiv = document.createElement('div');
         expDiv.id = 'review-explanation';
         expDiv.style.marginTop = '30px';
         expDiv.style.padding = '24px';
         expDiv.style.background = '#1f2937';
         expDiv.style.borderRadius = '8px';
         expDiv.style.borderLeft = '4px solid #10b981';
         expDiv.innerHTML = `
           <h4 style="color:#10b981; margin:0 0 10px; font-size:14px; text-transform:uppercase; font-weight:900;">Learning Note</h4>
           <p style="margin:0; line-height:1.6; color:#d1d5db; font-size:15px;">${escapeHtml(q.explanation || 'No explanation available.')}</p>
         `;
         optionsEl.after(expDiv);
       }
       
       document.getElementById('mark-btn').style.color = state.marked.has(globalIdx) ? '#f59e0b' : '';
    }

    function selectOption(idx) {
      if (state.isReview) return;
      const globalIdx = state.currentBlock * Q_PER_BLOCK + state.currentQ;
      state.answers[globalIdx] = idx;
      saveState();
      initUI();
    }

    function toggleMark() {
      const globalIdx = state.currentBlock * Q_PER_BLOCK + state.currentQ;
      if (state.marked.has(globalIdx)) state.marked.delete(globalIdx);
      else state.marked.add(globalIdx);
      saveState();
      initUI();
    }

    function jumpToQ(i) {
      state.currentQ = i;
      saveState();
      initUI();
    }

    function nextQ() {
      if (state.currentQ < Q_PER_BLOCK - 1) {
        state.currentQ++;
        saveState();
        initUI();
      }
    }

    function prevQ() {
      if (state.currentQ > 0) {
        state.currentQ--;
        saveState();
        initUI();
      }
    }

    function submitBlock(isAuto = false) {
      if (!isAuto && !confirm('Are you sure you want to end this block? You cannot return to these questions later.')) return;
      
      state.isBreak = true;
      state.currentBlock++;
      state.currentQ = 0;
      
      if (state.currentBlock >= TOTAL_BLOCKS) {
        finishExam();
      } else {
        document.getElementById('sim-ui').classList.add('hidden');
        document.getElementById('break-ui').classList.remove('hidden');
        saveState();
      }
    }

    function startNextBlock() {
       state.isBreak = false;
       state.blockStartTimes[state.currentBlock] = Date.now();
       document.getElementById('sim-ui').classList.remove('hidden');
       document.getElementById('break-ui').classList.add('hidden');
       saveState();
       initUI();
    }

    function finishExam() {
      state.isReview = true; // Flag for later review
      document.getElementById('sim-ui').classList.add('hidden');
      document.getElementById('break-ui').classList.add('hidden');
      document.getElementById('report-ui').classList.add('visible');
      
      // Calculate Score
      let correct = 0;
      let globalIdx = 0;
      for (let b = 0; b < TOTAL_BLOCKS; b++) {
        for (let q = 0; q < Q_PER_BLOCK; q++) {
          const question = state.questions[b][q];
          if (state.answers[globalIdx] === question.correct_index) {
            correct++;
          }
          globalIdx++;
        }
      }

      const totalAnswered = Object.keys(state.answers).length;
      const totalQ = TOTAL_BLOCKS * Q_PER_BLOCK;
      const scorePct = Math.round((correct / totalQ) * 100);
      
      document.getElementById('report-stats').innerHTML = `
        <div style="font-size: 64px; font-weight: 900; color: #10b981; margin-bottom: 10px;">${scorePct}%</div>
        <div style="color: var(--text-muted); margin-bottom: 40px; font-weight:700;">PROVISIONAL PERFORMANCE REPORT</div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom:30px;">
          <div style="background: #1f2937; padding: 20px; border-radius: 12px; border:1px solid #374151;">
             <div style="font-size: 24px; font-weight: 900;">${correct} / ${totalQ}</div>
             <div style="font-size: 11px; color: #9ca3af; text-transform: uppercase; font-weight:800;">Correct Answers</div>
          </div>
          <div style="background: #1f2937; padding: 20px; border-radius: 12px; border:1px solid #374151;">
             <div style="font-size: 24px; font-weight: 900;">${totalAnswered}</div>
             <div style="font-size: 11px; color: #9ca3af; text-transform: uppercase; font-weight:800;">Questions Attempted</div>
          </div>
        </div>

        <button class="btn btn-primary" onclick="enterReviewMode()" style="background:#a855f7; width:100%; margin-bottom:12px;">Review All Questions</button>
      `;
      
      // We keep state for review, but will clear on final exit
    }

    function enterReviewMode() {
      state.currentBlock = 0;
      state.currentQ = 0;
      state.isReview = true;
      state.isBreak = false;
      document.getElementById('report-ui').classList.remove('visible');
      document.getElementById('sim-ui').classList.remove('hidden');
      document.getElementById('block-timer').textContent = "REVIEW";
      document.getElementById('global-timer').textContent = "COMPLETE";
      
      // Toggle buttons for review
      document.getElementById('end-block-btn').classList.add('hidden');
      document.getElementById('exit-review-btn').classList.remove('hidden');
      
      initUI();
    }

    function exitSimulator() {
      localStorage.removeItem('mh_sim_state');
      window.location.href = 'medical-exam-usmle.html';
    }

    // --- INITIALIZE ---
    loadState();
    setInterval(updateTimers, 1000);

    // Theme toggle
    if (window.MediHelp) MediHelp.initTheme();
  </script>
</body>
</html>
